backfill_history:
  name: Backfill Energy History
  description: Fetches daily history into the separate pseg:electricity_consumption_daily and pseg:electricity_cost_daily statistics. These are an alternative daily view; do not add them to overlapping hourly consumption in the Energy dashboard.
  fields:
    start_date:
      name: Start Date
      description: The starting date to backfill from (YYYY-MM-DD). Defaults to 2 years ago if left empty.
      example: "2024-10-19"
      selector:
        date:
    end_date:
      name: End Date
      description: The ending date to backfill to (YYYY-MM-DD). Defaults to today if left empty.
      example: "2026-10-19"
      selector:
        date:
